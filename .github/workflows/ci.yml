name: v3.2-qa

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3.2-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall scanner tests
      - name: Test
        run: python -m pytest -q

name: v3.3-qa

on:
  push:
    branches: [main]
    # Bot'un state commit'leri skip-ci isareti tasir, CI'i tetiklemez.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3.3-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall scanner tests tools
      - name: Test
        run: python -m pytest -q
      - name: Live DOTUSDT V3.3 dry-run
        run: python -m tools.qa_dot_v33

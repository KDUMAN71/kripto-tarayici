name: crypto-scan-v3
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'   # YEDEK: cron-job.org duserse saatlik devam (asil tempo dis tetik)

permissions:
  contents: write

concurrency:
  group: crypto-scan-v3
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch/schedule run'i kuyrukta beklerken main ilerlemis olabilir.
          # Run basladigi anda event SHA'si yerine en guncel main'i al.
          ref: main
          fetch-depth: 1
      - name: Enforce approximately hourly cadence
        id: cadence
        run: |
          python - <<'PY'
          import json, os, time
          try:
              with open("state/state.json", encoding="utf-8") as f:
                  last_ok = int(json.load(f).get("last_ok_run") or 0)
          except (FileNotFoundError, ValueError, TypeError, KeyError):
              last_ok = 0
          elapsed = int(time.time()) - last_ok
          allowed = elapsed >= 55 * 60 or elapsed < 0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("run_scan=" + ("true" if allowed else "false") + "\n")
          print(f"Hourly gate: {'RUN' if allowed else 'SKIP'}; seconds since successful scan: {elapsed}")
          PY
      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.run_scan == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        if: steps.cadence.outputs.run_scan == 'true'
        run: pip install -r requirements.txt
      - name: Run V3.3 scanner
        if: steps.cadence.outputs.run_scan == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
        run: python -m scanner.main
      - name: Build compact state summary
        if: steps.cadence.outputs.run_scan == 'true'
        run: python -m tools.state_health
      - name: Build failure attribution report
        if: steps.cadence.outputs.run_scan == 'true'
        run: python -m tools.failure_attribution
      - name: Build shadow challenger report
        if: steps.cadence.outputs.run_scan == 'true'
        run: python -m tools.challenger_report
      - name: Build OOS promotion review report
        if: steps.cadence.outputs.run_scan == 'true'
        run: python -m tools.promotion_report
      - name: Commit state
        if: steps.cadence.outputs.run_scan == 'true'
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/state.json state/summary.json state/runner_autopsy.json state/outcome_ledger.json state/failure_attribution.json state/challenger_report.json state/promotion_report.json
          if [ -d state/outcome_archive ]; then git add -A state/outcome_archive; fi

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "v3.3 state update [skip ci]"

          # Normalde scanner concurrency nedeniyle baska scan bu sirada main'e yazamaz.
          # Yine de insan/otomasyon main'i tarama sirasinda ilerletirse once taze ref'i al.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::warning::main tarama sirasinda degisti ve state rebase conflict olustu; bu run'in state push'u atlandi. Sonraki tarama guncel main'den devam edecek."
            exit 0
          fi

          # Fetch ile push arasinda cok nadir yeni bir main commit'i gelirse bir kez daha dene.
          if ! git push origin HEAD:main; then
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::warning::State push retry rebase conflict; bu run'in state push'u atlandi."
              exit 0
            fi
            if ! git push origin HEAD:main; then
              echo "::warning::State push ikinci denemede de yaristi; workflow hata vermeden state push'u atlandi."
              exit 0
            fi
          fi

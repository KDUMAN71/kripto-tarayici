name: v3.5-reverse-engineering

on:
  workflow_dispatch:
    inputs:
      days:
        description: Lookback days
        required: false
        default: '30'
      min_run_pct:
        description: First threshold-cross percentage from trailing 24h low
        required: false
        default: '10'
      max_events:
        description: Maximum runner episodes after daily balancing
        required: false
        default: '240'
      events_per_day:
        description: Maximum runner episodes kept per UTC day
        required: false
        default: '8'
      controls_per_runner:
        description: Same-time matched non-runner controls per runner
        required: false
        default: '1'
      max_symbols:
        description: Optional symbol cap for smoke tests; blank = all
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Episode replay regression tests
        run: python -m pytest -q tests/test_v35_episode_replay.py
      - name: Build episode-first replay dataset
        shell: bash
        run: |
          EXTRA=()
          if [ -n "${{ inputs.max_symbols }}" ]; then
            EXTRA+=(--max-symbols "${{ inputs.max_symbols }}")
          fi
          python -m research.build_runner_dataset_v2 \
            --days "${{ inputs.days }}" \
            --min-run-pct "${{ inputs.min_run_pct }}" \
            --max-events "${{ inputs.max_events }}" \
            --events-per-day "${{ inputs.events_per_day }}" \
            --controls-per-runner "${{ inputs.controls_per_runner }}" \
            --output artifacts/v35_episode_replay_v2.json \
            "${EXTRA[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: v35-episode-replay-v2
          path: artifacts/v35_episode_replay_v2.json
          retention-days: 14

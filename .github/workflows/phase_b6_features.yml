name: phase-b6-feature-discrimination
on:
  push:
    branches: [research/phase-b6-feature-discrimination]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: phase-b5-independent-results
          path: artifacts/b5
          run-id: 37736500511
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run paired feature study
        run: python -m research.phase_b6_features --source artifacts/b5/phase_b5_independent_study.json --output artifacts/phase_b6_features.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-b6-feature-results
          path: artifacts/phase_b6_features.json
          retention-days: 30

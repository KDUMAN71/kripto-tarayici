name: exit-counterfactual-research
on:
  push:
    branches: [research/exit-counterfactual-v1]
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_exit_counterfactual.py
      - run: python -m research.exit_counterfactual --source state/state.json --output artifacts/exit_counterfactual.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-counterfactual-results
          path: artifacts/exit_counterfactual.json
          retention-days: 30
